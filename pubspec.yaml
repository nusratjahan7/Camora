name: camera_overlay
description: "Camera Overlay - overlay a reference image on the live camera preview."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  gal: ^2.3.3
  go_router: ^18.0.2
  image_picker: ^1.2.4
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: 2.15.0

flutter:
  uses-material-design: true
